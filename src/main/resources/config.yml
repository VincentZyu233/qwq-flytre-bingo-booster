# 🎯 qwq-flytre-bingo-booster 配置

# 📢 日志级别 (Log Level): debug, info, warn, error, silent
# 🐛 debug  - 输出所有日志（调试用 🔧）
# ℹ️  info   - 输出 info 及以上（默认 ✅）
# ⚠️  warn   - 只输出警告和错误 🟡
# ❌ error  - 只输出错误 🔴
# 🔇 silent - 关闭所有日志 🤫
log_level: info

# 🧾 命令名配置
# `team_color_dye` - 开关队伍染色，为玩家名添加对应队伍颜色与前缀
# `bingo_sidebar`  - 开关右侧队伍成员侧边栏显示
# `bingo_effect`   - 设置或关闭常驻药水效果
commands:
  team_color_dye: qwq_bingo_team_color_dye
  bingo_sidebar: qwq_bingo_sidebar
  bingo_effect: qwq_bingo_effect

# 🚀 功能默认启用配置
features:
  team_color_dye:
    enabled_on_load: true
    refresh_interval_ticks: 10
    apply_duration_ticks: 114514
  bingo_sidebar:
    enabled_on_load: true
    refresh_interval_ticks: 10
    apply_duration_ticks: 114514
  bingo_effect:
    enabled_on_load: true
    refresh_interval_ticks: 10
    apply_duration_ticks: 114514

# 💊 Bingo 常驻药水效果列表
# 每个对象表示一条受插件管理的常驻药水效果配置
# `enabled`         - 是否启用该效果
# `type`            - 药水效果 ID，例如 minecraft:night_vision
# `amplifier`       - Bukkit 内部等级值，0=1级，1=2级，2=3级，以此类推
# `hide_particles`  - 是否隐藏粒子效果
bingo_effects:
  # 默认效果：急迫 4，隐藏粒子，默认启用
  - enabled: true
    type: minecraft:haste
    amplifier: 3
    hide_particles: true
  # 默认效果：迅捷 3，隐藏粒子，默认启用
  - enabled: true
    type: minecraft:speed
    amplifier: 2
    hide_particles: true
  # 默认效果：夜视 2，隐藏粒子，默认启用
  - enabled: true
    type: minecraft:night_vision
    amplifier: 1
    hide_particles: true

# 🔐 权限配置
# 控制谁能执行插件的命令
# 可选值:
#   op                    - 仅 OP（ops.json 中的玩家）和 Console 可执行（默认 ✅）
#   console               - 仅服务端后台 Console 可执行，所有人（包括 OP）都不行
#   everyone              - 所有人都可执行（不进行权限检查）
#   <自定义权限节点>        - 使用自定义权限节点进行控制
#                           如果安装了 LuckPerms 等权限插件，可在此处填写节点名，
#                           然后在权限插件中为玩家或权限组赋予该节点即可，
#                           无需将玩家设为 OP。
#                           例: permission_mode: qwq-flytre-bingo-booster.admin
#                                → 给玩家 / 组加 qwq-flytre-bingo-booster.admin 节点
permission_mode: op

# 👥 队伍检测配置
team_detection:
  # 🔍 检测方式: team 或 scoreboard
  # team       - 优先读玩家当前 scoreboard 上的原生 team，读不到时回退主 scoreboard（推荐 ✅）
  # scoreboard - 读主计分板某个 objective 的分数值
  method: team
  # 📊 如果用 scoreboard 方式，指定主计分板 objective 名
  scoreboard_name: teamScore
