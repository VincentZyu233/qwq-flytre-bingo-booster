name: Build & Release & Publish

on:
  push:
    branches: [main, for-*]
  pull_request:
    branches: [main, for-*]

permissions:
  contents: write

jobs:
  check:
    name: Check commit message
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.flags.outputs.should_build }}
      should_release: ${{ steps.flags.outputs.should_release }}
      should_publish: ${{ steps.flags.outputs.should_publish }}
      version: ${{ steps.flags.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse commit message
        id: flags
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          MSG="$COMMIT_MSG"

          VERSION="v$(grep '^version' build.gradle.kts | head -1 | sed "s/.*\"\(.*\)\".*/\1/")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "should_build=true"    >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUILD=false
          RELEASE=false
          PUBLISH=false

          if echo "$MSG" | grep -qi "build publish"; then
            BUILD=true
            RELEASE=true
            PUBLISH=true
          elif echo "$MSG" | grep -qi "build release"; then
            BUILD=true
            RELEASE=true
          elif echo "$MSG" | grep -qi "build action"; then
            BUILD=true
          fi

          echo "should_build=$BUILD"     >> "$GITHUB_OUTPUT"
          echo "should_release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "should_publish=$PUBLISH" >> "$GITHUB_OUTPUT"

          echo "📋 Flags: build=$BUILD release=$RELEASE publish=$PUBLISH"

  build:
    name: Build plugin JAR
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Prepare artifact
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          JAR_FILE=$(ls build/libs/*-all.jar | head -1)
          ASSET_NAME="qwq-flytre-bingo-booster-${VERSION}.jar"
          cp "$JAR_FILE" "$ASSET_NAME"
          echo "📦 Output: $ASSET_NAME"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.asset_name }}
          path: ${{ env.asset_name }}

  release:
    name: Publish Release
    needs: [check, build]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List downloaded files
        run: ls -lh

      - name: Delete existing release & tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          echo "🗑️ Cleaning up existing release/tag: $VERSION"
          gh release delete "$VERSION" --yes --cleanup-tag 2>/dev/null || echo "No existing release to delete"
          sleep 3

      - name: Generate release notes from template
        env:
          VERSION: ${{ needs.check.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${VERSION}$" | head -1)

          collect_changelog() {
            local range_args=("$@")
            git log "${range_args[@]}" --pretty=format:'%s|%h|%an|%ad' --date=format:'%m-%d %H:%M' --reverse \
              | grep -Evi '^chore: trigger release; build release\|' \
              | awk -F'|' '{
                  subj=$1
                  if (length(subj) > 88) subj=substr(subj, 1, 85) "..."
                  print subj " (`" $2 "`) - @" $3 " [" $4 "]"
                }'
          }

          if [ -n "$PREV_TAG" ]; then
            collect_changelog "${PREV_TAG}..HEAD" > changelog_raw.txt
          else
            collect_changelog > changelog_raw.txt
          fi

          if [ -s changelog_raw.txt ]; then
            sed 's/^/> /; G' changelog_raw.txt > changelog_rendered.txt
          else
            echo '> No changelog entries.' > changelog_rendered.txt
          fi

          {
            while IFS= read -r line || [ -n "$line" ]; do
              if [ "$line" = "__CHANGE_LOG__" ]; then
                cat changelog_rendered.txt
                continue
              fi

              line="${line//__REPO__/$REPO}"
              line="${line//__VERSION__/$VERSION}"
              line="${line//__BRANCH__/${{ github.ref_name }}}"
              line="${line//__COMMIT_HASH__/${{ github.sha }}}"
              printf '%s\n' "$line"
            done < .github/release_template.md
          } > release_notes.md

          echo "📝 Release notes:"
          cat release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          JAR_FILE=$(ls qwq-flytre-bingo-booster-*.jar | head -1)
          echo "📤 Uploading: $JAR_FILE"
          gh release create "$VERSION" \
            --title "qwq-flytre-bingo-booster ${VERSION}" \
            --notes-file release_notes.md \
            --latest \
            "$JAR_FILE"

  publish:
    name: Publish to Modrinth & CurseForge
    needs: [check, build, release]
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List downloaded files
        run: ls -lh

      - name: Locate JAR file
        id: jar
        run: |
          JAR_FILE=$(ls qwq-flytre-bingo-booster-*.jar | head -1)
          echo "jar_file=$JAR_FILE" >> "$GITHUB_OUTPUT"
          echo "📦 JAR: $JAR_FILE"

      - name: Publish to Modrinth
        uses: RubixDev/modrinth-upload@v1
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project_id: ${{ secrets.MODRINTH_PROJECT_ID }}
          file_path: ${{ steps.jar.outputs.jar_file }}
          name: qwq-flytre-bingo-booster ${{ needs.check.outputs.version }}
          version: ${{ needs.check.outputs.version }}
          game_versions: "1.21.5"
          loaders: "paper,spigot"
          release_type: "release"
          featured: false

      - name: Publish to CurseForge
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project_id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          game_endpoint: "minecraft"
          file_path: ${{ steps.jar.outputs.jar_file }}
          release_type: "release"
