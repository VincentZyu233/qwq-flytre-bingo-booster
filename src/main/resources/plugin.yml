name: qwq-flytre-bingo-booster
version: '${version}'
main: qwq.zyu.qwqFlytreBingoBooster.QwqFlytreBingoBooster
api-version: '1.21'
load: POSTWORLD
prefix: 【qwq-flytre-bingo-booster】
authors: [ VincentZyu ]
description: 🎯👥🎨📊⚡ Flytre Bingo booster, server side plugin： team name dyeing + scoreboard sidebar
website: https://github.com/VincentZyuApps
folia-supported: true

commands:
  qwq_bingo_team_color_dye:
    description: 根据 team_detection 配置给玩家名字染色并加上前缀，可通过 config.yml 自定义命令名
    usage: /qwq_bingo_team_color_dye <true/false>
  qwq_bingo_sidebar:
    description: 显示 bingo 队伍侧边栏（0.5 秒刷新），可通过 config.yml 自定义命令名
    usage: /qwq_bingo_sidebar <true/false>
  qwq_bingo_effect:
    description: 给所有在线玩家持续补药水效果，可通过 config.yml 自定义命令名
    usage: /qwq_bingo_effect <true/false> <effect> <amplifier> <true/false>
